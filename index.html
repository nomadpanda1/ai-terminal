<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Terminal | 峰の数字自留地</title>
    <link rel="stylesheet" href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire_1-y/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #0f0;
            --mika-pink: #ff8da1; /* 未花专属粉色 */
            --bg-color: rgba(10, 10, 10, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        
        /* 数字雨背景画布 */
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.6; }
        
        /* 终端主容器 (毛玻璃效果) */
        .terminal-container {
            position: relative; z-index: 1; width: 90%; max-width: 900px; height: 85vh;
            margin: 40px auto; background: var(--bg-color); border-radius: 12px;
            border: 1px solid var(--glass-border); box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            backdrop-filter: blur(10px); display: flex; flex-direction: column;
        }

        /* 头部控制台 */
        .terminal-header {
            padding: 15px 20px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5);
            border-top-left-radius: 12px; border-top-right-radius: 12px;
        }
        .header-title { font-weight: bold; font-size: 1.2rem; color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        
        /* 人格切换器 */
        .persona-selector select {
            background: #222; color: #fff; border: 1px solid var(--neon-green); padding: 5px 10px;
            border-radius: 4px; font-family: inherit; outline: none; cursor: pointer; transition: all 0.3s;
        }

        /* 聊天区域 */
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 8px; line-height: 1.5; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: rgba(0, 255, 0, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); border-bottom-right-radius: 0; }
        .msg.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-bottom-left-radius: 0; }
        .msg-mika { border-color: var(--mika-pink) !important; box-shadow: 0 0 8px rgba(255,141,161,0.3); }

        /* 输入区域 */
        .input-area { padding: 20px; border-top: 1px solid var(--glass-border); display: flex; gap: 15px; background: rgba(0,0,0,0.5); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        #prompt-input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 12px 15px; border-radius: 6px; font-family: inherit; outline: none; transition: border 0.3s; }
        #prompt-input:focus { border-color: var(--neon-green); }
        
        /* 发送按钮 (动态变色) */
        #send-btn {
            background: #222; color: var(--neon-green); border: 1px solid var(--neon-green);
            padding: 0 25px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-family: inherit;
        }
        #send-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); }
        
        /* 未花专属粉色按钮状态 */
        #send-btn.mika-mode { border-color: var(--mika-pink); color: var(--mika-pink); }
        #send-btn.mika-mode:hover { background: var(--mika-pink); color: #000; box-shadow: 0 0 15px var(--mika-pink); }
        
        /* 隐藏滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="terminal-container">
    <div class="terminal-header">
        <div class="header-title"><i class="fas fa-terminal"></i> AI_AGENT_TERMINAL_V1.0</div>
        <div class="persona-selector">
            <select id="persona-select" onchange="switchPersona()">
                <option value="camus">[🧠 挂载模块] 荒诞派哲学家 - 加缪</option>
                <option value="mika">[🎀 挂载模块] 代码 QA 总监 - 未花</option>
            </select>
        </div>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="msg ai" id="welcome-msg">SYS_INIT_SUCCESS: 欢迎访问数字自留地终端。今天打算把哪块石头推上山？</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="prompt-input" placeholder="输入指令或按 F12 呼出神明..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> 执行</button>
    </div>
</div>

<script>
    // --- 1. 黑客帝国数字雨特效引擎 ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
    const fontSize = 14; const columns = canvas.width / fontSize;
    const drops = []; for(let x = 0; x < columns; x++) drops[x] = 1;
    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const isMika = document.getElementById('persona-select').value === 'mika';
        ctx.fillStyle = isMika ? '#ff8da1' : '#0F0'; 
        ctx.font = fontSize + 'px monospace';
        for(let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // --- 2. 核心逻辑与 Persona 切换 ---
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeMsg = document.getElementById('welcome-msg');
    
    // 切换人格时触发 UI 变色
    function switchPersona() {
        const mode = document.getElementById('persona-select').value;
        if(mode === 'mika') {
            sendBtn.classList.add('mika-mode');
            welcomeMsg.className = 'msg ai msg-mika';
            welcomeMsg.innerHTML = "哼，居然现在才呼叫未花！快把那些跑不通的代码交出来，要是写得太烂，我可是会生气的哦！";
        } else {
            sendBtn.classList.remove('mika-mode');
            welcomeMsg.className = 'msg ai';
            welcomeMsg.innerHTML = "SYS_INIT_SUCCESS: 欢迎访问数字自留地终端。今天打算把哪块石头推上山？";
        }
    }

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        const mode = document.getElementById('persona-select').value;
        div.className = `msg ${isUser ? 'user' : 'ai'} ${!isUser && mode === 'mika' ? 'msg-mika' : ''}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 绑定回车发送
    input.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
        const text = input.value.trim();
        if(!text) return;
        addMessage(text, true);
        input.value = '';
        const persona = document.getElementById('persona-select').value;
        
        // --- API 请求区 (需对接你的 CF Worker) ---
        addMessage("...", false); // Loading 状态
        const loadingDiv = chatBox.lastChild;
        
        try {
            // 💡 这里的 URL 换成你在第二步创建的 Cloudflare Worker 地址
            const response = await fetch('https://ai-agent-proxy.htklyf123.workers.dev/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, persona: persona })
            });
            const data = await response.json();
            loadingDiv.innerText = data.reply;
        } catch(e) {
            loadingDiv.innerText = "[SYS_ERROR] 信号被外星人拦截，请检查 Worker 连接。";
            if(persona === 'mika') loadingDiv.innerText = "网络断啦！Sensei 快去修路由器！";
        }
    }
</script>
</body>
</html>
